# Канон «Светлицы» (Q41): тег раунда → коммит. Машиночитаемая запись для сверки на М0:
# `git rev-parse <tag>^{commit}` обязан показать `sha`. Запись раунда дописывается сразу после
# того, как тег поставлен, — сам тег не может содержать собственный sha из своего дерева.
# Правка задним числом = красный флаг: сначала сверка с `git tag -v` и `origin`.
# Ворота `cargo run -p xtask -- canon` сверяют реестр с тегами в обе стороны (Q54):
# разошедшийся sha, запись без тега и тег без записи — красные ворота.
# Смена головы — только с записью в журнале и с `xtask canon` зелёным.

