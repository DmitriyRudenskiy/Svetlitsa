# ============================================================================
#  Конфигурация cargo для среды ворот (Alpine, musl). ADR-0023, решение 4.
#
#  Ключевое: **`-crt-static`**. Rust-мишень musl по умолчанию линкует libc
#  статически, а EFL грузит модули через `dlopen` (в eina_module.c — 7 вызовов):
#  статический бинарь не может загрузить динамический модуль, и вместо ошибки
#  получаем молча неработающие загрузчики/им-модули/плагины edje. Поэтому
#  динамическая линковка обязательна для всех крейтов, которые трогают EFL.
#
#  Единственное исключение — setuid-хелпер `stavni-auth` (ADR-0009): он,
#  наоборот, собирается со `+crt-static`, и переопределяет флаг у себя в билде,
#  а не здесь.
#
#  Мишень здесь не задаётся: в контейнере ворот хостовая тройка и есть
#  `x86_64-alpine-linux-musl` (пакет rust из Alpine), а на хосте-маке ворота
#  исполняются внутри того же образа, а не снаружи.
# ============================================================================

[target.x86_64-alpine-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
