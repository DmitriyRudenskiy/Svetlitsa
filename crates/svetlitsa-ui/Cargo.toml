[package]
name = "svetlitsa-ui"
description = "Инфраструктура «Светлицы» (см. ТЗ 3)"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Окно собирается только против настоящего EFL (образ ворот, ADR-0015);
# без фичи и `svetlitsa-ui`, и `bin/hello` — заглушки.
efl = ["dep:svetlitsa-efl", "svetlitsa-efl/efl"]

[dependencies]
svetlitsa-efl = { workspace = true, optional = true }
