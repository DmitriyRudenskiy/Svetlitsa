# cargo-deny. Профиль финализируется на М0 (ADR-0002); список лицензий = ADR-0002.
[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "LGPL-2.0-or-later",
  "LGPL-2.1-or-later",
  "GPL-2.0-or-later",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.93

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
